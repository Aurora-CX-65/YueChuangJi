# ============================================
# 阅创集 (YueChuangJi) Docker Compose 编排
# ============================================
# 启动: docker compose up -d
# 构建: docker compose build
# 查看日志: docker compose logs -f
# 停止: docker compose down
# 停止并清理数据: docker compose down -v
# ============================================

services:
  # ---- MySQL 8.0 数据库 ----
  mysql:
    image: mysql:8.0
    container_name: yuechuangji-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${DB_NAME:-yuechuangji}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "${DB_EXPOSE_PORT:-3306}:3306"
    volumes:
      # 数据持久化
      - mysql-data:/var/lib/mysql
      # 初始化 SQL 脚本
      - ./YueChuangJiApi/database/init_database.sql:/docker-entrypoint-initdb.d/01_init_database.sql:ro
      # MySQL 自定义配置
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
    networks:
      - yuechuangji-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ---- Redis 7 缓存 ----
  redis:
    image: redis:7-alpine
    container_name: yuechuangji-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    ports:
      - "${REDIS_EXPOSE_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - yuechuangji-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ---- Spring Boot 后端 API ----
  backend:
    build:
      context: ./YueChuangJiApi
      dockerfile: Dockerfile
    image: yuechuangji-api:${APP_VERSION:-latest}
    container_name: yuechuangji-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 服务器配置
      SERVER_PORT: 8080
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-yuechuangji}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root123456}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # 文件上传
      FILE_UPLOAD_PATH: /uploads
      FILE_ACCESS_BASE_URL: ${FILE_ACCESS_BASE_URL:-http://localhost}
      # 邮件配置（可选）
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # DeepSeek AI（可选）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # JWT 密钥
      JWT_SECRET: ${JWT_SECRET:-}
      # JVM 内存
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "${BACKEND_EXPOSE_PORT:-8080}:8080"
    volumes:
      # 上传文件持久化
      - upload-data:/uploads
      # 日志持久化
      - log-data:/var/log/yuechuangji-api
    networks:
      - yuechuangji-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ---- Nginx + Vue 前端 ----
  frontend:
    build:
      context: ./YueChuangJiUI
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_API_TIMEOUT: "30000"
        VITE_APP_TITLE: ${VITE_APP_TITLE:-阅创集}
        VITE_APP_VERSION: ${APP_VERSION:-1.0.0}
    image: yuechuangji-ui:${APP_VERSION:-latest}
    container_name: yuechuangji-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_EXPOSE_PORT:-80}:80"
    networks:
      - yuechuangji-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

# ---- 网络 ----
networks:
  yuechuangji-net:
    name: yuechuangji-net
    driver: bridge

# ---- 数据卷 ----
volumes:
  mysql-data:
    name: yuechuangji-mysql-data
  redis-data:
    name: yuechuangji-redis-data
  upload-data:
    name: yuechuangji-upload-data
  log-data:
    name: yuechuangji-log-data
